<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Cab copy — not on this device</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #101010;
        --paper: #fff;
        --steel: #6c6861;
        --crown: #ffd500;
      }
      html[data-theme="dark"] {
        --ink: #f2f2f2;
        --paper: #111;
        --steel: #c5c1ba;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100dvh;
        padding: 2rem 1.25rem 4rem;
        font: 1.05rem/1.5 system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      .mono {
        font-family: ui-monospace, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.75rem;
        color: var(--steel);
      }
      h1 {
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 0.95;
        letter-spacing: -0.03em;
        margin: 0.4rem 0 1rem;
        font-weight: 700;
      }
      p {
        max-width: 38rem;
        margin-bottom: 1rem;
      }
      a {
        color: inherit;
        text-decoration: none;
        display: inline-block;
        margin-right: 1rem;
        margin-top: 0.5rem;
        border-bottom: 2px solid var(--crown);
        padding-bottom: 0.1rem;
      }
    </style>
  </head>
  <body>
    <p class="mono">sin() — cab copy</p>
    <h1>NOT ON THIS DEVICE.</h1>
    <p>
      Open Proven or the sling desk on a network once. After that those pages
      stay here when the trailer Wi-Fi is dead. Filled forms stay on this device.
      Official WorkSafeBC and BC Crane Safety files still need a line.
    </p>
    <p>
      <a href="/safety">Proven</a>
      <a href="/sling">Sling desk</a>
    </p>
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem("wire-theme") ||
            localStorage.getItem("whoop-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </body>
</html>
